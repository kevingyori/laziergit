<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3040"/>
      <stop offset="1" stop-color="#14151b"/>
    </linearGradient>
    <radialGradient id="blob" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#d6e2ff"/>
      <stop offset="0.55" stop-color="#9dbcff"/>
      <stop offset="1" stop-color="#6f96f0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>

  <g clip-path="url(#clip)">
    <!-- ground shadow -->
    <ellipse cx="512" cy="846" rx="260" ry="34" fill="#000" opacity="0.35" filter="url(#soft)"/>

    <!-- sprout: a tiny git branch growing from the head -->
    <g fill="none" stroke-linecap="round" stroke-width="32">
      <path d="M492 470 V216" stroke="#5fc27e"/>
      <path d="M492 420 C492 350 628 372 628 296" stroke="#e5b45a"/>
    </g>
    <circle cx="492" cy="208" r="44" fill="#5fc27e"/>
    <circle cx="492" cy="322" r="30" fill="#252836" stroke="#5fc27e" stroke-width="26"/>
    <circle cx="628" cy="282" r="30" fill="#252836" stroke="#e5b45a" stroke-width="26"/>
    <!-- mochi body -->
    <path d="M512 440
             C708 440 806 580 806 700
             C806 800 720 840 512 840
             C304 840 218 800 218 700
             C218 580 316 440 512 440 Z" fill="url(#blob)"/>
    <!-- highlight -->
    <ellipse cx="400" cy="540" rx="70" ry="36" fill="#ffffff" opacity="0.35" transform="rotate(-25 400 540)"/>

    <!-- sleepy face -->
    <g fill="none" stroke="#1b1d25" stroke-width="22" stroke-linecap="round">
      <path d="M388 660 Q426 692 464 660"/>
      <path d="M560 660 Q598 692 636 660"/>
      <path d="M490 724 Q512 744 534 724"/>
    </g>
    <ellipse cx="360" cy="722" rx="38" ry="22" fill="#f58bb4" opacity="0.6"/>
    <ellipse cx="664" cy="722" rx="38" ry="22" fill="#f58bb4" opacity="0.6"/>

    <!-- z z -->
    <g fill="none" stroke="#c9d6f5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <path d="M296 250 H356 L296 310 H356" stroke-width="20"/>
      <path d="M226 360 H262 L226 396 H262" stroke-width="13" opacity="0.7"/>
    </g>
  </g>

  <rect x="102.5" y="102.5" width="819" height="819" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="5"/>
</svg>
