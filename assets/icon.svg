<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2d34"/>
      <stop offset="1" stop-color="#131417"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)" filter="url(#shadow)"/>

  <g clip-path="url(#clip)"><g transform="translate(14 0)">
    <!-- soft glow under the lanes -->
    <g filter="url(#glow)" opacity="0.45" fill="none" stroke-width="48" stroke-linecap="round">
      <path d="M412 862 V162" stroke="#7aa7ff"/>
      <path d="M412 774 C412 690 612 710 612 640 V384 C612 314 412 334 412 250" stroke="#5fc27e"/>
    </g>

    <!-- lanes: main (blue) and a branch (green) that forks and merges back -->
    <g fill="none" stroke-width="40" stroke-linecap="round">
      <path d="M412 862 V162" stroke="#7aa7ff"/>
      <path d="M412 774 C412 690 612 710 612 640 V384 C612 314 412 334 412 250" stroke="#5fc27e"/>
    </g>

    <!-- commits; the merge at the top is filled -->
    <g stroke-width="32">
      <circle cx="412" cy="250" r="58" fill="#7aa7ff" stroke="#7aa7ff"/>
      <circle cx="412" cy="512" r="44" fill="#1f2025" stroke="#7aa7ff"/>
      <circle cx="412" cy="774" r="44" fill="#1a1b1f" stroke="#7aa7ff"/>
      <circle cx="612" cy="426" r="44" fill="#212228" stroke="#5fc27e"/>
      <circle cx="612" cy="598" r="44" fill="#1e1f24" stroke="#5fc27e"/>
    </g>
  </g></g>

  <!-- hairline edge -->
  <rect x="102.5" y="102.5" width="819" height="819" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="5"/>
</svg>
